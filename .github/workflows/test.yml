name: bluetooth test

on: [push, workflow_dispatch]

jobs:
  test:
    # macos-26 for Xcode 26 and the iOS 26 runtime the shim targets. Free on a public
    # repo — the public-repo discount covers Actions usage regardless of the image.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Boot a simulator
        id: sim
        run: |
          set -eo pipefail
          # By device-type name, not identifier: the identifier list is not ordered by
          # release, so a hardcoded one is easily paired with a runtime that refuses it.
          UDID=$(xcrun simctl create test "iPhone 17")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Serve the recorded device to that simulator.
      - uses: yuriipopow/bletether@v1
        with:
          fixture: fixtures/demo.json
          device: ${{ steps.sim.outputs.udid }}

      # Run the UI test. It injects BleTether into the app through its launchEnvironment,
      # using the dylib and fixture the BleTether step set up, then asserts the app read
      # the served device's battery. This is a plain `xcodebuild test`.
      - name: Run the UI test
        run: |
          set -eo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          DYLIB=$(xcrun simctl spawn "$UDID" launchctl getenv DYLD_INSERT_LIBRARIES)
          FIX=$(xcrun simctl spawn "$UDID" launchctl getenv BLETETHER_FIXTURE)
          # TEST_RUNNER_ prefix: that is how xcodebuild forwards environment into the
          # UI test runner, where the test reads it and injects it into the app.
          TEST_RUNNER_BLETETHER_DYLIB="$DYLIB" \
          TEST_RUNNER_BLETETHER_FIXTURE_PATH="$FIX" \
            xcodebuild test -project BLEScanner.xcodeproj -scheme BLEScanner \
              -destination "id=$UDID"

      - name: Tear down
        if: always() && steps.sim.outputs.udid != ''
        run: xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true
